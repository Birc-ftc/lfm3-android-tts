name: Build LFM3 Audio TTS APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4
      - name: JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android SDK Kur
        uses: android-actions/setup-android@v3
      - name: NDK ve CMake Yükle
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: llama.cpp Çek
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
      - name: Gradle Hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK Derle
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK'yı Yükle
        uses: actions/upload-artifact@v4
        with:
          name: LFM3-TTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
