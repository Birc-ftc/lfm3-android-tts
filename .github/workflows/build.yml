yaml
name: Build LFM3 Audio TTS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Depoyu indir
      - name: Depoyu indir
        uses: actions/checkout@v4

      # 2. Java 17
      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle 8.9
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 4. Android SDK paketlerini doğrudan kur.
      # setup-android eylemi kullanılmadığı için eski "tools
