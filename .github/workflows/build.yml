name: Build LFM3 Audio TTS APK

on:
  workflow_dispatch:

jobs:
  build-apk:
  
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK ve NDK Kurulumu
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: llama.cpp Çek
        run: |
          mkdir -p app/src/main/cpp
          if [ ! -d "app/src/main/cpp/llama.cpp" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          fi

      - name: Proje Yapılandırma Dosyalarını Zorunlu Oluştur
        run: |
          # 1. Kök build.gradle.kts
          echo 'plugins {' > build.gradle.kts
          echo '    id("com.android.application") version "8.5.2" apply false' >> build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' >> build.gradle.kts
          echo '}' >> build.gradle.kts

          # 2. Kök settings.gradle.kts
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "LFM3AudioTTS"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts

          # 3. app/build.gradle.kts
          mkdir -p app
          echo 'plugins {' > app/build.gradle.kts
          echo '    id("com.android.application")' >> app/build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android")' >> app/build.gradle.kts
          echo '}' >> app/build.gradle.kts
          echo 'android {' >> app/build.gradle.kts
          echo '    namespace = "com.liquidai.lfmtts"' >> app/build.gradle.kts
          echo '    compileSdk = 35' >> app/build.gradle.kts
          echo '    defaultConfig {' >> app/build.gradle.kts
          echo '        applicationId = "com.liquidai.lfmtts"' >> app/build.gradle.kts
          echo '        minSdk = 29' >> app/build.gradle.kts
          echo '        targetSdk = 35' >> app/build.gradle.kts
          echo '        versionCode = 1' >> app/build.gradle.kts
          echo '        versionName = "1.0"' >> app/build.gradle.kts
          echo '        ndk { abiFilters += listOf("arm64-v8a") }' >> app/build.gradle.kts
          echo '        externalNativeBuild { cmake { cppFlags += listOf("-std=c++17", "-O3") } }' >> app/build.gradle.kts
          echo '    }' >> app/build.gradle.kts
          echo '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' >> app/build.gradle.kts
          echo '    kotlinOptions { jvmTarget = "17" }' >> app/build.gradle.kts
          echo '    externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }' >> app/build.gradle.kts
          echo '}' >> app/build.gradle.kts
          echo 'dependencies { implementation("androidx.appcompat:appcompat:1.7.0"); implementation("androidx.core:core-ktx:1.13.1") }' >> app/build.gradle.kts

      - name: Gradle Wrapper Başlat ve APK Derle
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı Yükle
        uses: actions/upload-artifact@v4
        with:
          name: LFM3-TTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
